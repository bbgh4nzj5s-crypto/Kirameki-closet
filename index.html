<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff0fa"><title>ななのコーデルーム｜試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#684577;background:#fff3fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 5% 10%,#e2fcff,transparent 35%),radial-gradient(circle at 95% 20%,#ffe3fa,transparent 40%),linear-gradient(180deg,#fff9ff,#f8f6ff);box-shadow:0 0 25px #e9cee6}.top{flex:none;padding:calc(env(safe-area-inset-top) + 9px) 14px 8px;background:linear-gradient(115deg,#ffd5f2,#c9f8fc 55%,#ede0ff);border-bottom:3px solid white;box-shadow:0 3px 0 #e6a9e5}.brand{text-align:center;font-weight:1000;font-size:19px;color:#e858a4;text-shadow:1px 2px white;letter-spacing:1px}.sub{text-align:center;font-size:10px;color:#93628f}.view{flex:1;min-height:0;overflow-y:auto;padding:12px 13px 25px}.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px 5px calc(env(safe-area-inset-bottom) + 7px);background:#fff;border-top:2px solid #f9c4ed}.nav button{border:0;background:none;color:#94759b;font-size:10px;padding:5px 1px;border-radius:13px;font-weight:800}.nav button span{display:block;font-size:22px;margin-bottom:2px}.nav .on{background:linear-gradient(160deg,#ffcae9,#f7e3ff);color:#d43c93;box-shadow:inset 0 0 0 2px #fff,0 2px 0 #f2a9d9}.panel{background:#ffffffdd;border:2px solid white;border-radius:20px;padding:13px;box-shadow:0 4px 0 #e5d8f0,0 0 0 1px #efcce9;margin-bottom:14px}.title{font-size:17px;font-weight:900;color:#d64699;margin:2px 0 11px}.pill{border:1px solid #edb6dd;background:#fff;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:700;color:#a6639b}.pill.active{background:#ffcae8;color:#a72976;border-color:#ef79bc}.btn{border:2px solid white;border-radius:99px;background:linear-gradient(#ff98d3,#ec58a8);color:#fff;font-weight:900;padding:11px 17px;box-shadow:0 4px 0 #ba428c,0 0 0 1px #e879b4;text-shadow:0 1px #cc438b}.btn:active{transform:translateY(3px);box-shadow:0 1px #ba428c}.btn.secondary{background:linear-gradient(#b5faff,#65d5e7);box-shadow:0 4px #55b2c0;text-shadow:0 1px #55adbf}.btn.ghost{background:#fff;color:#bc559f;text-shadow:none;box-shadow:0 3px #ead0e5;border-color:#f7d1ea}.small{padding:7px 11px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{width:100%;border:2px solid #f4c9e6;background:#fff;border-radius:13px;padding:11px;color:#684577;outline:0}.field:focus{border-color:#ed77b4}.hint{font-size:11px;color:#967e9d;line-height:1.65}.tags{display:flex;flex-wrap:wrap;gap:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:2px solid white;background:white;border-radius:17px;padding:7px;box-shadow:0 3px 0 #e7c6e6;text-align:left;overflow:hidden;position:relative}.art{aspect-ratio:4/3;border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--a,#f8badd),#fff 55%,var(--b,#d8e7ff));font-size:43px}.art:before{content:'✦  ♡  ✧';position:absolute;inset:10px 0 auto;text-align:center;font-size:17px;color:#ffffffc9}.art img{height:100%;width:100%;object-fit:contain;position:relative;z-index:2}.item strong{display:block;font-size:12px;padding-top:6px;line-height:1.45;min-height:40px}.tiny{font-size:10px;color:#997c9c}.flag{position:absolute;right:6px;top:6px;background:#fff9;border-radius:20px;font-size:10px;font-weight:bold;padding:3px 7px}.swatch{display:inline-block;width:15px;height:15px;border:2px solid white;box-shadow:0 0 0 1px #ebc9e3;border-radius:50%;vertical-align:middle}.hero{text-align:center;padding:24px 13px;background:radial-gradient(circle,#ffffffb5,transparent 75%),linear-gradient(130deg,#f9d7f2,#d3ffff);border:3px solid white;border-radius:28px;box-shadow:0 5px #e2b8e4;margin-bottom:15px}.hero .emoji{font-size:66px;filter:drop-shadow(0 5px #ffffff)}.hero h2{color:#d7489c;text-shadow:2px 2px white;font-size:22px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.stat{padding:12px 5px;text-align:center;background:#fff;border-radius:17px;border:2px solid #f5dbf2;font-weight:900;color:#e051a5}.stat small{display:block;color:#947b9a;font-size:10px;margin-bottom:4px}.stat span{font-size:23px}.sectionhead{font-weight:900;color:#bc5ca2;margin:12px 3px 9px}.modalbg{position:fixed;z-index:10;inset:0;background:#5434517d;display:flex;align-items:end;justify-content:center}.modal{width:min(520px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(#fff9ff,#fff);border:3px solid #fff;border-radius:25px 25px 0 0;padding:14px 15px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -5px 0 #f2a5d9}.lab{font-size:12px;font-weight:800;color:#af6aab;margin:10px 0 5px}.stage{height:285px;border:5px solid white;border-radius:25px;background:radial-gradient(ellipse at 50% 70%,#fff 15%,#fbd9f7 60%,#d2f3ff);position:relative;overflow:hidden;box-shadow:0 4px #ddbde8}.stage:after{content:'✧   ♡   ✦   ♡   ✧';position:absolute;bottom:6px;width:100%;text-align:center;color:#e9a9d7;font-size:21px}.silhouette{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:135px;opacity:.23;filter:grayscale(1)}.layer{position:absolute;left:50%;transform:translateX(-50%);text-align:center;font-size:13px;min-width:115px;padding:5px 11px;border:2px solid white;border-radius:30px;background:#fff9;color:#ad6a9a;font-weight:bold;box-shadow:0 2px #e3c2e4}.layer.top{top:33%}.layer.bottom{top:53%}.layer.shoes{top:72%}.layer.acc{top:19%}.layer.dress{top:42%}.dresslist{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}.dressopt{min-width:126px;width:126px;padding:8px;background:white;border:2px solid #f5c7e5;border-radius:15px;font-size:11px;text-align:center}.dressopt.selected{border-color:#e856a7;background:#fff0fa}.selectwrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.empty{text-align:center;padding:25px 8px;color:#ad8cad}.counter{font-size:12px;color:#977f9c;text-align:right}.notice{background:#f7f1ff;border:1px solid #e3cef3;padding:10px;border-radius:13px;font-size:11px;line-height:1.6}.savedthumb{height:95px;background:linear-gradient(125deg,#ffdef3,#dbfaff);display:flex;align-items:center;justify-content:center;font-size:45px;border-radius:12px}.view::-webkit-scrollbar{width:4px}.view::-webkit-scrollbar-thumb{background:#eeb2dc;border-radius:8px}
</style></head><body><div id="app"><header class="top"><div class="brand">♡ ななのコーデルーム ✦</div><div class="sub">じぶんだけのコーデ＆コレクション • 試作版</div></header><main id="view" class="view"></main><nav class="nav" id="nav"></nav></div><div id="modalhost"></div><script>
const START=[['スマイルハートバズリウムピンク','ピンク','★★★★'],['スマイルハートバズリウムグリーン','グリーン','★★★★'],['スマイルハートバズリウムレッド','レッド','★★★★'],['ピュアハートバズリウムブルー','ブルー','★★★★'],['ピュアハートバズリウムイエロー','イエロー','★★★★'],['エレガントクリスタルパープル','パープル','★★★★'],['トランプレディ','ブラック','★★★★'],['テディベアフリル','ピンク','★★★'],['テディベアフリルレッド','レッド','★★★'],['エンジェルスポーツ','ブルー','★★★'],['メモリアルクロック','ブルー','★★★'],['ピクニックバスケット','ブラウン','★★★'],['パンプキンハロウィンブラック','ブラック','★★★★'],['ハイセンスがくえんせいふく','ブルー','★★'],['アンティークロック','ブラウン','★★']].map((x,i)=>({id:'official-'+i,name:x[0],color:x[1],rarity:x[2],series:'アイプリバース',edition:'おねがい4だん',owned:false,wish:false,favorite:false,tags:'',memo:'',image:'',parts:{},source:'https://aipri.jp/verse/item/oa4.html'}));
const COLORS={'ピンク':'#f8a2cf','レッド':'#fb777e','ブルー':'#83d1fb','イエロー':'#ffe27f','グリーン':'#a7ebc0','パープル':'#c6a2ef','ブラック':'#71677d','ブラウン':'#c59d86','ホワイト':'#f5f1f3','オレンジ':'#ffc08c'};
const STORE='nana-coord-prototype-v1';let data;try{data=JSON.parse(localStorage.getItem(STORE))}catch(e){}if(!data)data={items:START,books:[]};function persist(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('保存容量が不足しています。画像を減らしてください。')}}let tab='home',query='',color='すべて',onlyOwned=false,modalId=null,dress={top:null,bottom:null,shoes:null,acc:null,dress:null},dressCat='top';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats={top:'トップス',bottom:'ボトムス',shoes:'シューズ',acc:'アクセ',dress:'ワンピース'};const icons={home:'⌂',search:'⌕',collection:'♡',dress:'♧',book:'▤'};const navnames={home:'ホーム',search:'さがす',collection:'コレクション',dress:'きせかえ',book:'BOOK'};
function go(t){tab=t;render();$('#view').scrollTop=0}function nav(){ $('#nav').innerHTML=Object.keys(navs()).map(k=>`<button class="${tab===k?'on':''}" data-tab="${k}"><span>${icons[k]}</span>${navnames[k]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab))}function navs(){return navnames}function itemBy(id){return data.items.find(x=>x.id===id)}function imageArt(x){return `<div class="art" style="--a:${COLORS[x.color]||'#f8badd'};--b:#d8e7ff">${x.image?`<img src="${x.image}" alt="">`:'👗'}</div>`}function itemcard(x){return `<button class="item" data-open="${esc(x.id)}">${imageArt(x)}<div class="flag">${x.owned?'♡ 所持':'未所持'}</div><strong>${esc(x.name)}</strong><div class="tiny"><span class="swatch" style="background:${COLORS[x.color]||'#ddd'}"></span> ${esc(x.color)} ・ ${esc(x.rarity)}</div></button>`}function results(){const q=query.trim().toLowerCase().normalize('NFKC');return data.items.filter(x=>(!onlyOwned||x.owned)&&(color==='すべて'||x.color===color)&&(!q||[x.name,x.color,x.tags,x.memo,x.edition,x.series].join(' ').toLowerCase().normalize('NFKC').includes(q)))}
function home(){const owned=data.items.filter(x=>x.owned).length;return `<div class="hero"><div class="emoji">🎀✨</div><h2>きょうはどのコーデにする？</h2><div class="hint">さがして・あつめて・きせかえよう♡</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="go('search')">コーデをさがす ›</button><button class="btn secondary" onclick="go('dress')">きせかえする ›</button></div></div><div class="stats"><div class="stat"><small>サンプルコーデ</small><span>${data.items.length}</span></div><div class="stat"><small>所持コーデ</small><span>${owned}</span></div><div class="stat"><small>BOOK</small><span>${data.books.length}</span></div></div><div class="panel"><div class="title">✦ この試作について</div><p class="hint">公式サイトに記載された「おねがい4だん」の一部のコーデ名をサンプル登録しています。公式画像や全シリーズのデータはまだ収録していません。</p><div class="notice">データはこのiPhoneのブラウザ内に保存します。Safariのデータ消去などで失われる場合があります。現時点では本番用のバックアップ機能はありません。</div></div><div class="panel"><div class="title">♡ さいきんのコーデ</div><div class="grid">${data.items.slice(0,4).map(itemcard).join('')}</div></div>`}
function search(collection=false){const arr=results();return `<div class="panel"><div class="title">${collection?'♡ マイコレクション':'✦ コーデをさがす'}</div><input class="field" id="q" placeholder="名前・タグ・メモでさがす" value="${esc(query)}"><div class="lab">カラーでしぼる</div><div class="tags">${['すべて',...Object.keys(COLORS)].map(c=>`<button class="pill ${color===c?'active':''}" data-color="${c}">${c==='すべて'?'すべて':`<span class="swatch" style="background:${COLORS[c]}"></span> ${c}`}</button>`).join('')}</div><div class="row" style="margin-top:12px"><label style="font-size:12px"><input type="checkbox" id="owned" ${onlyOwned?'checked':''}> 所持しているコーデだけ</label><button class="pill" id="additem" style="margin-left:auto">＋ コーデ追加</button></div></div><div class="sectionhead">${collection?'登録したコーデ':'検索結果'} <span class="tiny">${arr.length}件</span></div>${arr.length?`<div class="grid">${arr.map(itemcard).join('')}</div>`:'<div class="empty">あてはまるコーデはありません</div>'}`}
function dressView(){let choices=data.items.filter(x=>x.owned);return `<div class="title">✦ きせかえステージ</div><div class="stage"><div class="silhouette">👗</div>${Object.entries(dress).filter(([k,id])=>id).map(([k,id])=>`<div class="layer ${k}">${esc(itemBy(id)?.name||'')}</div>`).join('')}</div><div class="panel" style="margin-top:12px"><div class="row between"><b>アイテムをえらぶ</b><button class="pill" onclick="dress={top:null,bottom:null,shoes:null,acc:null,dress:null};render()">クリア</button></div><div class="selectwrap">${Object.entries(cats).map(([k,v])=>`<button class="pill ${dressCat===k?'active':''}" data-cat="${k}">${v}</button>`).join('')}</div><div class="hint">この試作では、コーデ全体を各部位の仮アイテムとして選択します。部位ごとの公式画像は未登録です。</div><div class="dresslist">${choices.length?choices.map(x=>`<button class="dressopt ${dress[dressCat]===x.id?'selected':''}" data-wear="${x.id}"><div style="font-size:28px">👗</div>${esc(x.name)}</button>`).join(''):'<div class="empty">先にコレクションから「所持」にしてね</div>'}</div><div class="row"><button class="btn" id="savebook">♡ BOOKに保存</button><button class="btn secondary" id="savepic">画像を保存</button></div></div>`}
function bookView(){return `<div class="title">♡ マイコーデBOOK</div><div class="hint" style="margin-bottom:12px">自分で作った着せ替えを保存して、いつでも呼び出せるよ。</div>${data.books.length?`<div class="grid">${data.books.slice().reverse().map(x=>`<div class="item"><div class="savedthumb">👗✨</div><strong>${esc(x.name)}</strong><div class="tiny">${esc(x.date)}</div><div class="row"><button class="btn small" data-load="${esc(x.id)}">きせかえる</button><button class="pill" data-delete="${esc(x.id)}">削除</button></div></div>`).join('')}</div>`:'<div class="panel empty">まだ作品がありません。きせかえ画面から保存してね ♡</div>'}`}
function render(){nav();$('#view').innerHTML=({home:home,search:()=>search(false),collection:()=>search(true),dress:dressView,book:bookView})[tab]();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;render()});const q=$('#q');if(q){q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(pos,pos)};$('#owned').onchange=e=>{onlyOwned=e.target.checked;render()};$('#additem').onclick=()=>openItem(null)}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{dressCat=b.dataset.cat;render()});document.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{dress[dressCat]=b.dataset.wear;if(dressCat==='dress'){dress.top=null;dress.bottom=null}else if(['top','bottom'].includes(dressCat))dress.dress=null;render()});if($('#savebook')){$('#savebook').onclick=saveBook;$('#savepic').onclick=savePicture}document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{dress={...data.books.find(x=>x.id===b.dataset.load).dress};go('dress')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この作品を削除しますか？')){data.books=data.books.filter(x=>x.id!==b.dataset.delete);persist();render()}}) }
function openItem(id){modalId=id;const x=itemBy(id)||{name:'',color:'ピンク',rarity:'',edition:'',series:'手動追加',owned:false,wish:false,favorite:false,tags:'',memo:'',image:''};$('#modalhost').innerHTML=`<div class="modalbg" id="bg"><div class="modal"><div class="row between"><div class="title">♡ ${id?'コーデ詳細':'コーデを追加'}</div><button class="pill" id="close">✕ とじる</button></div>${imageArt(x)}<div class="lab">コーデ名</div><input class="field" id="iname" value="${esc(x.name)}"><div class="row"><div style="flex:1"><div class="lab">カラー</div><select class="field" id="icolor">${Object.keys(COLORS).map(c=>`<option ${x.color===c?'selected':''}>${c}</option>`).join('')}</select></div><div style="flex:1"><div class="lab">登場弾</div><input class="field" id="iedition" value="${esc(x.edition)}"></div></div><div class="lab">公式画像・好きな写真（任意）</div><input type="file" id="iphoto" accept="image/*" class="field"><div class="hint">iPhone内の画像を登録できます。容量の大きい画像は保存できない場合があります。</div><div class="row" style="margin:12px 0"><label><input type="checkbox" id="iowned" ${x.owned?'checked':''}> 所持</label><label><input type="checkbox" id="iwish" ${x.wish?'checked':''}> ♡ほしい</label><label><input type="checkbox" id="ifav" ${x.favorite?'checked':''}> ☆お気に入り</label></div><div class="lab">タグ（カンマ区切り）</div><input class="field" id="itags" value="${esc(x.tags)}" placeholder="かわいい, ねこ, 冬"><div class="lab">メモ</div><textarea class="field" id="imemo" rows="3">${esc(x.memo)}</textarea><div class="row" style="margin-top:15px"><button class="btn" id="isave">♡ 保存する</button>${id&&!id.startsWith('official-')?'<button class="btn ghost" id="idelete">削除</button>':''}</div></div></div>`;$('#close').onclick=closeModal;$('#bg').onclick=e=>{if(e.target.id==='bg')closeModal()};$('#isave').onclick=async()=>{const name=$('#iname').value.trim();if(!name)return alert('コーデ名を入れてね');let pic=x.image;const file=$('#iphoto').files[0];if(file){pic=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}const updated={...x,id:id||'custom-'+Date.now(),name,color:$('#icolor').value,edition:$('#iedition').value,owned:$('#iowned').checked,wish:$('#iwish').checked,favorite:$('#ifav').checked,tags:$('#itags').value,memo:$('#imemo').value,image:pic};if(id){const i=data.items.findIndex(z=>z.id===id);data.items[i]=updated}else data.items.unshift(updated);persist();closeModal();render()};
if($('#idelete'))$('#idelete').onclick=()=>{if(confirm('このコーデを削除しますか？')){data.items=data.items.filter(z=>z.id!==id);persist();closeModal();render()}}}
function closeModal(){$('#modalhost').innerHTML=''}function saveBook(){if(!Object.values(dress).some(Boolean))return alert('先にコーデを選んでね');const name=prompt('作品の名前を入力してね','マイコーデ '+(data.books.length+1));if(name===null)return;data.books.push({id:'book-'+Date.now(),name:name.trim()||'マイコーデ',date:new Date().toLocaleDateString('ja-JP'),dress:{...dress}});persist();alert('BOOKに保存したよ♡');render()}
function savePicture(){const c=document.createElement('canvas');c.width=900;c.height=1200;const ctx=c.getContext('2d');const g=ctx.createLinearGradient(0,0,900,1200);g.addColorStop(0,'#ffe0f3');g.addColorStop(.55,'#e4fbff');g.addColorStop(1,'#ecdafa');ctx.fillStyle=g;ctx.fillRect(0,0,900,1200);ctx.textAlign='center';ctx.fillStyle='#cc60a4';ctx.font='bold 55px sans-serif';ctx.fillText('♡ マイコーデ ♡',450,100);ctx.font='140px sans-serif';ctx.fillText('👗',450,400);ctx.font='bold 34px sans-serif';Object.entries(dress).filter(([k,v])=>v).forEach(([k,id],i)=>{ctx.fillText(cats[k]+'：'+itemBy(id)?.name,450,560+i*80)});c.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-coord.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}
render();
</script></body></html>
