field input,.field textarea,.field select,.search{width:100%;padding:11px;border-radius:12px;border:1px solid #e7cadb;background:#fff;color:var(--ink);outline:0;min-height:43px}.field input:focus,.field textarea:focus,.search:focus{border:2px solid #de7aa9}.field textarea{min-height:65px;resize:vertical}.pilltabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}.pill{flex-shrink:0;border-radius:100px;border:1px solid #e6c9dd;background:white;color:#a36b91;font-weight:800;padding:8px 12px}.pill.active{color:white;background:#e379a9;border-color:#e379a9}.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.itemcard{min-width:0;text-align:left;position:relative;border:1px solid #efd6e5;border-radius:15px;background:white;padding:6px;color:#64455f;box-shadow:0 2px 9px #c98cbd1b}.thumb{width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffeaf5,#edf6ff);border-radius:10px;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:contain}.thumb .placeholder{font-size:34px;opacity:.5}.itemcard .name{font-size:11px;line-height:1.4;font-weight:800;margin:6px 1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ribbon{position:absolute;right:4px;top:4px;font-size:10px;background:#fffdfaee;border-radius:7px;padding:3px}.minibadges{display:flex;gap:2px;flex-wrap:wrap;font-size:9px}.mini{background:#f6e6f0;border-radius:6px;padding:2px 4px}.mini.yes{background:#e0f4e9;color:#497b69}.empty{text-align:center;color:#aa8caa;padding:32px 10px;font-size:13px}.filters{display:flex;gap:8px;align-items:center;margin:12px 0}.filters .search{flex:1;min-width:0}.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font-size:11px;background:#f9e8f4;border-radius:30px;padding:5px 9px;border:1px solid #f0cfe3;color:#9d5485}.parts{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.part{font-size:10px;padding:4px 6px;border-radius:7px;background:#f0e9f0;color:#927e91}.part.owned{background:#e8f6eb;color:#417d59}.part.missing{background:#ffecf1;color:#b7718d}.inline-list{display:flex;gap:10px;overflow-x:auto;padding:6px 0 12px}.inline-list .itemcard{min-width:116px;width:116px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fdf7fb;border-radius:12px;margin:5px 0}.toggle input{width:20px;height:20px;accent-color:#d968a2}.photoadd{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border:1px dashed #ce98bd;background:#fff8fc;border-radius:15px;min-height:88px;padding:12px;text-align:center;cursor:pointer;position:relative}.photoadd img{max-height:104px;max-width:100%;object-fit:contain}.photoadd input{position:absolute;inset:0;opacity:0;cursor:pointer}.photoadd span{font-size:11px;color:#9d6b91}.qrclick{border:1px solid #eacbdf;background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;color:#b0598c}.modalback{position:absolute;inset:0;background:#39203b88;z-index:50;display:flex;justify-content:center;align-items:flex-end;padding:12px}.modal{width:100%;background:#fffafe;border-radius:24px;padding:17px;max-height:89%;overflow:auto;box-shadow:0 15px 40px #4b205c66}.modal h2{margin:0 0 12px;font-size:19px}.close{margin-left:auto;border:0;background:#f6e8f1;border-radius:50%;width:34px;height:34px;font-size:21px}.divider{border-top:1px dashed #e9d1e2;margin:14px 0}.foot{position:sticky;bottom:-30px;margin:20px -14px -30px;padding:12px 14px calc(20px + env(safe-area-inset-bottom));background:#fffafef5;border-top:1px solid #efd2e5;z-index:2}.note{font-size:12px;line-height:1.7;color:#94718e}.error{background:#ffe7e9;border:1px solid #e6aab0;padding:10px;border-radius:12px;color:#a74760}.success{background:#e9f7f1;border:1px solid #a8d9c8;padding:10px;border-radius:12px;color:#397f66}.dressstage{display:grid;grid-template-columns:1fr 1fr;gap:8px}.figure{height:310px;position:relative;border-radius:20px;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 15px #b886b21e;background:linear-gradient(#fffafb,#eee4ff)}.figure:before{content:'♡';position:absolute;top:8px;left:10px;color:#e1c7dc;font-size:21px}.silhouette{position:absolute;inset:25px 25px 13px;opacity:.25;pointer-events:none}.silhouette .head{position:absolute;background:#ceafc9;width:43px;height:49px;border-radius:48% 48% 45% 45%;top:10px;left:calc(50% - 22px)}.silhouette .body{position:absolute;top:62px;left:calc(50% - 30px);width:60px;height:129px;background:#ceafc9;clip-path:polygon(12% 0,88% 0,100% 32%,75% 43%,70% 100%,30% 100%,25% 43%,0 32%)}.silhouette .legs{position:absolute;top:180px;left:calc(50% - 24px);width:48px;height:102px;background:#ceafc9;clip-path:polygon(0 0,100% 0,94% 100%,57% 100%,50% 30%,43% 100%,6% 100%)}.layerimg{position:absolute;left:50%;top:50%;width:72%;height:60%;object-fit:contain;touch-action:none;user-select:none;filter:drop-shadow(0 2px 2px #0001)}.layerimg.selected{outline:2px dashed #e274b0;outline-offset:2px}.figurelabel{position:absolute;bottom:7px;left:7px;background:#ffffffd9;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:850;z-index:9}.editcontrols{background:#fff;border-radius:15px;padding:11px;border:1px solid #f2d6e7}.range{width:100%;accent-color:#dc7ead}.bookpreview{display:flex;gap:2px;background:#f2e5f1;padding:5px;border-radius:12px;height:190px}.bookpreview .figure{flex:1;height:180px;border-radius:10px}.bookpreview .figure .silhouette{transform:scale(.55);transform-origin:top center;inset:10px 5px 0}.bookpreview .figurelabel{font-size:9px}.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#61455f;color:white;padding:11px 16px;border-radius:100px;z-index:100;max-width:90%;text-align:center;box-shadow:0 6px 20px #4e2b4c66;font-size:12px}.help{display:inline-block;border:1px solid #e9d5e5;color:#a66a90;background:white;border-radius:20px;padding:4px 9px;font-size:11px}.bigqr{width:100%;max-width:330px;max-height:50vh;object-fit:contain;background:white;border-radius:15px;padding:12px;display:block;margin:12px auto}.listrow{display:flex;align-items:center;gap:10px;border:1px solid #edd6e5;padding:10px;border-radius:14px;background:#fff;margin:7px 0}.tinythumb{width:52px;height:56px;border-radius:10px;background:#f8edf5;object-fit:contain}.swatch{display:inline-block;width:16px;height:16px;border:1px solid #ddd;border-radius:50%;vertical-align:middle;margin-right:4px}.danger{color:#c35b7a}.nowrap{white-space:nowrap}.settitle{font-size:12px;font-weight:900;margin:11px 0 6px}.muted{color:var(--muted)}.quick{border:0;background:#f7e7f1;border-radius:20px;padding:6px 9px;color:#a95887;font-weight:750}.tagline{font-size:11px;color:#9c7295;line-height:1.6}.collectionbox{border:1px solid #ecd4e5;background:#fff;border-radius:16px;margin:9px 0;padding:12px}.step{display:flex;gap:5px;margin:10px 0}.step span{height:5px;flex:1;background:#efdbe9;border-radius:9px}.step span.done{background:#e275a9}@media(min-width:700px){.app{box-shadow:0 0 90px #5f3d6250}}@media(max-width:360px){.cardgrid{gap:6px}.screen{padding-inline:9px}.tile{min-height:100px}.figure{height:280px}}
</style></head><body><div id="app" class="app"><header class="top"><div><div class="logo">✧ きらめきクローゼット</div><small>わたしだけのコーデアルバム</small></div><div class="topright"><button class="circle" data-act="backupMenu" aria-label="バックアップ">☁</button><button class="circle" data-act="help" aria-label="ヘルプ">?</button></div></header><main id="screen" class="screen"></main><nav id="nav" class="nav"></nav><div id="overlay"></div><div id="toast"></div></div>
<script>
'use strict';
const CATS=['トップス','ボトムス','シューズ','アクセ','ワンピース'];
const EMO={'トップス':'👚','ボトムス':'👗','シューズ':'👠','アクセ':'🎀','ワンピース':'👗'};
const COLORS={'ピンク':'#f29abc','赤':'#ee6b79','オレンジ':'#eea66a','黄色':'#f1dc79','緑':'#83c594','水色':'#8dd9e8','青':'#729be4','紫':'#b48ae4','白':'#ffffff','黒':'#33323c','茶色':'#ad8169','グレー':'#b9b8bf'};
const empty=()=>({version:1,coords:[],collections:[],book:[],bookGroups:[],homePins:[],dress:{left:{},right:{}},settings:{}});
let db,DB=empty(),tab='home',listType='coord',query='',listFilter='all',listSort='new',currentId=null,editStep=1,draft=null,editing=false,modal=null,selectedSide='left',selectedCat='トップス',dressSelected=null,bookQuery='',bookPart='all',bookGroup='all',collId=null,toastTimer;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=s=>esc(s).replace(/`/g,'&#96;');
const uid=()=>globalThis.crypto?.randomUUID?.()||'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const cats=c=>c.style==='onepiece'?['ワンピース','シューズ','アクセ']:['トップス','ボトムス','シューズ','アクセ'];
const allItems=()=>DB.coords.flatMap(c=>cats(c).map(cat=>({c,cat,it:c.items[cat]})));
const getC=id=>DB.coords.find(c=>c.id===id);
const itemKey=(id,cat)=>id+'::'+cat;
const extractKey=k=>{let p=k.split('::');return {id:p[0],cat:p[1]}};
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s　_-]+/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const similar=(a,b)=>{a=norm(a);b=norm(b);return a===b|| (a.length>=3&&b.length>=3&&(a.includes(b.slice(0,Math.min(5,b.length)))||b.includes(a.slice(0,Math.min(5,a.length)))))};
const newItem=()=>({image:'',qr:'',owned:false,fav:false,want:false,color:[],tags:'',memo:''});
const newCoord=(name='',style='separate')=>({id:uid(),name,number:'',style,cover:'',color:[],tags:'',memo:'',fav:false,want:false,items:Object.fromEntries(CATS.map(k=>[k,newItem()])),created:Date.now(),updated:Date.now()});
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('kirameki_closet_v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('main')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode){return db.transaction('main',mode).objectStore('main')}
function getStored(){return new Promise((resolve,reject)=>{let r=tx('readonly').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let saveChain=Promise.resolve();function persist(){DB.version=1;let snap=structuredClone(DB);saveChain=saveChain.then(()=>new Promise((resolve,reject)=>{let r=tx('readwrite').put(snap,'state');r.onsuccess=resolve;r.onerror=()=>reject(r.error)})).catch(e=>{console.error(e);message('保存できませんでした。容量を確認してください')});return saveChain}
function message(t){$('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').innerHTML='',2800)}
function fileData(file,max=1200){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject(Error('画像ファイルを選んでください'));let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let ratio=Math.min(1,max/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*ratio));cv.height=Math.max(1,Math.round(img.height*ratio));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let png=/png|webp|gif/.test(file.type),out=cv.toDataURL(png?'image/png':'image/jpeg',png?undefined:.83);URL.revokeObjectURL(url);resolve(out)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('画像を読み込めませんでした'))};img.src=url})}
const pill=(label,action,active=false)=>`<button class="pill ${active?'active':''}" data-act="${action}">${esc(label)}</button>`;
const button=(t,act,cl='')=>`<button class="btn ${cl}" data-act="${act}">${t}</button>`;
const imgHTML=(src,ph='✦')=>src?`<img src="${attr(src)}" alt="画像">`:`<span class="placeholder">${ph}</span>`;
function render(){let navs=[['home','🏠','ホーム'],['list','🗂️','さがす'],['register','➕','登録'],['dress','👗','きせかえ'],['mine','📖','マイページ']];$('nav').innerHTML=navs.map(([id,ico,label])=>`<button class="${tab===id?'active':''}" data-act="nav:${id}"><span class="emo">${ico}</span>${label}</button>`).join('');$('screen').innerHTML=({home:homePage,list:listPage,register:registerPage,dress:dressPage,mine:minePage})[tab]();$('overlay').innerHTML=modal?modalHTML():'';}
function go(t){tab=t;modal=null;$('screen').scrollTop=0;render()}
function coordCard(c){let owned=cats(c).filter(cat=>c.items[cat].owned).length;return `<button class="itemcard" data-act="detail:${c.id}"><div class="thumb">${imgHTML(c.cover||cats(c).map(x=>c.items[x].image).find(Boolean),'👗')}<span class="ribbon">${c.fav?'⭐':c.want?'♡':''}</span></div><div class="name">${esc(c.name)}</div><div class="minibadges"><span class="mini ${owned===cats(c).length?'yes':''}">所持 ${owned}/${cats(c).length}</span></div><div class="parts">${cats(c).map(x=>`<span class="part ${c.items[x].owned?'owned':'missing'}">${EMO[x]}</span>`).join('')}</div></button>`}
function itCard(c,cat){let it=c.items[cat];return `<button class="itemcard" data-act="item:${c.id}:${cat}"><div class="thumb">${imgHTML(it.image,EMO[cat])}<span class="ribbon">${it.fav?'⭐':it.want?'♡':''}</span></div><div class="name">${esc(c.name)}</div><div class="minibadges"><span class="mini">${esc(cat)}</span><span class="mini ${it.owned?'yes':''}">${it.owned?'所持':'未所持'}</span>${it.qr?'<span class="mini yes">QR✓</span>':''}</div></button>`}
function homePage(){const pins=DB.homePins.map(getC).filter(Boolean);return `<section class="hero"><h1>✧ MY CLOSET ✧</h1><p>コーデを集めて、自由にきせかえ♡</p></section><div class="menu"><button class="tile" data-act="nav:list"><span class="gi">🗂️</span><strong>コーデをさがす</strong><small>アイテム・所持・QR</small></button><button class="tile" data-act="new"><span class="gi">🎀</span><strong>あたらしく登録</strong><small>名前だけでもOK</small></button><button class="tile" data-act="nav:dress"><span class="gi">👗</span><strong>きせかえ</strong><small>ふたりのコーデも作れる</small></button><button class="tile" data-act="nav:mine"><span class="gi">💝</span><strong>マイコレクション</strong><small>好きな作品を集めよう</small></button></div><div class="section"><h2>♡ ホームに飾るコーデ</h2><button class="help" data-act="pinPicker">✎ えらぶ</button></div>${pins.length?`<div class="inline-list">${pins.map(coordCard).join('')}</div>`:`<div class="panel empty">お気に入りのコーデをここに飾ろう<br>「えらぶ」から設定できるよ</div>`}<div class="section"><h2>📖 オリジナルコーデBOOK</h2><button class="help" data-act="book">もっと見る ›</button></div>${DB.book.length?`<div class="inline-list">${DB.book.slice().reverse().slice(0,4).map(b=>`<button class="itemcard" style="width:116px;min-width:116px" data-act="bookDetail:${b.id}"><div class="thumb">📖</div><div class="name">${esc(b.name)}</div></button>`).join('')}</div>`:`<div class="panel empty">着せ替えで作ったコーデがここに並ぶよ</div>`}`}
function searchText(c,cat){if(cat){let it=c.items[cat];return [c.name,c.number,cat,it.tags,it.memo,it.color.join(' '),c.tags,c.memo].join(' ')}return [c.name,c.number,c.tags,c.memo,c.color.join(' '),...cats(c).map(k=>[c.items[k].tags,c.items[k].memo,c.items[k].color.join(' ')].join(' '))].join(' ')}
function matches(q,s){let words=q.trim().split(/\s+/).filter(Boolean);return words.every(w=>w.startsWith('-')?!norm(s).includes(norm(w.slice(1))):norm(s).includes(norm(w)))}
function listPage(){let arr=listType==='coord'?DB.coords.map(c=>({c})):allItems();arr=arr.filter(o=>{let it=o.cat?o.c.items[o.cat]:null;let flags=it?[it.owned,it.fav,it.want,!!it.qr]:[cats(o.c).every(x=>o.c.items[x].owned),o.c.fav,o.c.want,cats(o.c).some(x=>!!o.c.items[x].qr)];return (listFilter==='all'||({owned:flags[0],fav:flags[1],want:flags[2],qr:flags[3]}[listFilter]))&&matches(query,searchText(o.c,o.cat))});arr.sort((a,b)=>listSort==='name'?a.c.name.localeCompare(b.c.name,'ja'):listSort==='old'?a.c.created-b.c.created:b.c.created-a.c.created);return `<div class="section" style="margin-top:2px"><h2>🗂️ コーデ・アイテムをさがす</h2><span class="sub">${arr.length}件</span></div><div class="pilltabs">${pill('👗 コーデ','listType:coord',listType==='coord')}${pill('🎀 アイテム','listType:item',listType==='item')}</div><div class="filters"><input class="search" id="searchInput" placeholder="名前・カラー・タグ・メモを検索" value="${attr(query)}"><button class="btn alt sm" data-act="clearSearch">消す</button></div><div class="pilltabs">${[['all','すべて'],['owned','所持済'],['fav','お気に入り'],['want','ほしい'],['qr','QRあり']].map(([id,t])=>pill(t,'filter:'+id,listFilter===id)).join('')}</div><div class="row between" style="margin:10px 1px"><span class="sub">コーデ内の部位別所持状況も表示</span><select id="sort" class="pill" style="font-size:12px"><option value="new" ${listSort==='new'?'selected':''}>新しい順</option><option value="old" ${listSort==='old'?'selected':''}>古い順</option><option value="name" ${listSort==='name'?'selected':''}>名前順</option></select></div>${arr.length?`<div class="cardgrid">${arr.map(o=>o.cat?itCard(o.c,o.cat):coordCard(o.c)).join('')}</div>`:`<div class="empty">見つからなかったよ。別の名前やタグで探してみよう。</div>`}`}
function stepbar(n){return `<div class="step">${[1,2,3].map(i=>`<span class="${n>=i?'done':''}"></span>`).join('')}</div>`}
function registerPage(){if(!draft){return `<div class="section"><h2>🎀 あたらしく登録</h2></div><div class="panel"><p>カードを1枚ずつ登録しても、コーデをまとめて登録してもOK。名前だけで始められるよ。</p>${button('＋ コーデを登録','new')}</div><div class="section"><h2>最近登録したコーデ</h2></div><div class="cardgrid">${DB.coords.slice().reverse().slice(0,6).map(coordCard).join('')}</div>`}if(editStep===1)return `${stepbar(1)}<div class="section"><h2>${editing?'コーデを編集':'STEP 1　コーデの名前'}</h2></div><div class="panel"><div class="field"><label>コーデ名 *</label><input id="regName" value="${attr(draft.name)}" placeholder="例：ふわふわキャット"></div><div class="field"><label>コーデ番号（任意）</label><input id="regNumber" value="${attr(draft.number)}" placeholder="例：123-456"></div><div class="settitle">コーデの種類</div><div class="pilltabs">${pill('👚 トップス・ボトムス','style:separate',draft.style==='separate')}${pill('👗 ワンピース','style:onepiece',draft.style==='onepiece')}</div><p class="note">同じコーデ名のアイテムは一緒に管理されるよ。</p><div id="candidate"></div></div><div class="foot"><div class="row">${button('やめる','cancel','alt')}${button('つぎへ →','next1','grow')}</div></div>`;if(editStep===2)return `${stepbar(2)}<div class="section"><h2>STEP 2　写真・QRを登録</h2></div><p class="note">写真はあとからでも追加できるよ。QRは各アイテムごとに登録できるよ。</p><div class="panel"><div class="settitle">コーデの画像（任意）</div>${photoSlot('cover','コーデ全体の写真',draft.cover)}${cats(draft).map(cat=>`<div class="divider"></div><div class="row between"><strong>${EMO[cat]} ${cat}</strong><span class="sub">${draft.items[cat].qr?'QR登録済':'QR未登録'}</span></div><div class="two" style="margin-top:8px">${photoSlot('image:'+cat,'アイテム画像',draft.items[cat].image)}${photoSlot('qr:'+cat,'QR画像',draft.items[cat].qr)}</div><label class="toggle"><span>このアイテムを持っている</span><input type="checkbox" data-field="owned:${cat}" ${draft.items[cat].owned?'checked':''}></label>`).join('')}</div><div class="foot"><div class="row">${button('← もどる','back2','alt')}${button('つぎへ →','next2','grow')}</div></div>`;return `${stepbar(3)}<div class="section"><h2>STEP 3　詳細を設定</h2></div><p class="note">カラー・タグ・メモは後から変更できるよ。</p><div class="panel">${metaForm('coord',draft)}<div class="divider"></div>${cats(draft).map(cat=>`<div class="collectionbox"><strong>${EMO[cat]} ${cat}</strong>${metaForm('item:'+cat,draft.items[cat],true)}</div>`).join('')}</div><div class="foot"><div class="row">${button('← もどる','back3','alt')}${button('♡ 保存する','saveCoord','grow')}</div></div>`}
function photoSlot(type,label,src){return `<label class="photoadd">${src?`<img src="${attr(src)}">`:'<span style="font-size:25px">＋ 📷</span>'}<span>${esc(label)}${src?'（変更）':''}</span><input type="file" accept="image/*" data-photo="${attr(type)}"></label>`}
function metaForm(prefix,obj,small=false){return `<div class="field"><label>${small?'カラー':'カラータグ'}（複数選択OK）</label><div class="filterbar">${Object.entries(COLORS).map(([name,color])=>`<button class="chip" type="button" data-act="color:${prefix}:${name}" style="${obj.color.includes(name)?'border:2px solid #be6d9b;background:#f4dce9':''}"><span class="swatch" style="background:${color}"></span>${name}</button>`).join('')}</div></div><div class="field"><label>オリジナルタグ（カンマ区切り）</label><input data-meta="${prefix}:tags" value="${attr(obj.tags)}" placeholder="例：キュート,春,お気に入り"></div><div class="field"><label>メモ（検索対象になります）</label><textarea data-meta="${prefix}:memo" placeholder="自由に記録">${esc(obj.memo)}</textarea></div>`}
function newDraft(c=null){draft=c?structuredClone(c):newCoord();editing=!!c;editStep=1;go('register')}
function readDraft(){if(!draft)return;if(editStep===1){draft.name=$('regName')?.value.trim()??draft.name;draft.number=$('regNumber')?.value.trim()??draft.number}document.querySelectorAll('[data-field]').forEach(el=>{let [name,cat]=el.dataset.field.split(':');if(cat)draft.items[cat][name]=el.checked});document.querySelectorAll('[data-meta]').forEach(el=>{let [pre,field]=el.dataset.meta.split(':');if(pre==='coord')draft[field]=el.value;});document.querySelectorAll('[data-meta^="item:"]').forEach(el=>{let toks=el.dataset.meta.split(':');draft.items[toks[1]][toks[2]]=el.value})}
function candidates(){if(!draft)return '';let exact=DB.coords.filter(c=>c.id!==draft.id&&norm(c.name)===norm(draft.name));let approx=DB.coords.filter(c=>c.id!==draft.id&&norm(c.name)!==norm(draft.name)&&similar(c.name,draft.name)).slice(0,5);return `${exact.length?`<div class="error" style="margin-top:14px"><strong>⚠ 同じ名前の登録があります</strong><p>重複登録を防ぐため、既存のコーデを編集できます。</p>${exact.map(c=>button('既存の「'+esc(c.name)+'」を編集','edit:'+c.id,'alt sm')).join(' ')}</div>`:''}${approx.length?`<div class="panel"><strong>🌈 似た名前のコーデ</strong><p class="note">色違いかもしれないよ。確認してみてね。</p>${approx.map(c=>`<div class="listrow"><span class="grow">${esc(c.name)}</span><button class="quick" data-act="detail:${c.id}">見る</button></div>`).join('')}</div>`:''}`}
function detailPage(c){return `<div class="row between"><h2>👗 ${esc(c.name)}</h2><button class="close" data-act="close">×</button></div><div class="row"><div class="thumb" style="width:120px;flex-shrink:0">${imgHTML(c.cover||cats(c).map(k=>c.items[k].image).find(Boolean),'👗')}</div><div class="grow"><div class="tagline">${esc(c.number||'番号未登録')}<br>${c.style==='onepiece'?'ワンピース型':'トップス・ボトムス型'}</div><div style="margin:8px 0">${button(c.fav?'★ お気に入り':'☆ お気に入り','coordFlag:'+c.id+':fav','alt sm')} ${button(c.want?'♥ ほしい':'♡ ほしい','coordFlag:'+c.id+':want','alt sm')}</div>${button('✎ 編集','edit:'+c.id,'sm')}</div></div><div class="filterbar">${c.color.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${c.tags.split(',').filter(Boolean).map(x=>`<span class="chip">#${esc(x.trim())}</span>`).join('')}</div>${c.memo?`<p class="note">📝 ${esc(c.memo)}</p>`:''}<div class="section"><h2>アイテムの所持状況</h2><span class="sub">${cats(c).filter(x=>c.items[x].owned).length}/${cats(c).length} 所持</span></div>${cats(c).map(cat=>`<div class="listrow"><div class="tinythumb thumb">${imgHTML(c.items[cat].image,EMO[cat])}</div><div class="grow"><strong>${cat}</strong><div class="tagline">${c.items[cat].owned?'✅ 所持済み':'◻ 未所持'}・${c.items[cat].qr?'QR登録済':'QR未登録'}</div></div><button class="quick" data-act="qr:${c.id}:${cat}">QR</button><button class="quick" data-act="item:${c.id}:${cat}">詳細</button></div>`).join('')}<div class="divider"></div>${button('💝 コレクションに追加','addColl:coord:'+c.id,'alt')} ${button('🏠 ホームに飾る','pin:'+c.id,'alt')}<p class="note">画像やQRはユーザー自身が登録したものだけを表示します。</p>`}
function itemDetail(c,cat){let it=c.items[cat];return `<div class="row between"><h2>${EMO[cat]} ${cat}</h2><button class="close" data-act="close">×</button></div><p><strong>${esc(c.name)}</strong></p><div class="row" style="align-items:stretch"><div class="thumb grow" style="max-height:230px">${imgHTML(it.image,EMO[cat])}</div><div style="min-width:110px" class="stack">${button(it.owned?'✅ 所持済み':'◻ 未所持','itemFlag:'+c.id+':'+cat+':owned','alt sm')}${button(it.fav?'★ お気に入り':'☆ お気に入り','itemFlag:'+c.id+':'+cat+':fav','alt sm')}${button(it.want?'♥ ほしい':'♡ ほしい','itemFlag:'+c.id+':'+cat+':want','alt sm')}${button('QRを表示','qr:'+c.id+':'+cat,'sm')}</div></div><div class="filterbar">${it.color.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${it.tags.split(',').filter(Boolean).map(x=>`<span class="chip">#${esc(x.trim())}</span>`).join('')}</div>${it.memo?`<p class="note">📝 ${esc(it.memo)}</p>`:''}<div class="divider"></div>${button('✎ コーデ・画像・タグを編集','edit:'+c.id,'alt')} ${button('💝 コレクションに追加','addColl:item:'+itemKey(c.id,cat),'alt')}`}
function layer(cat,ref){return {...ref,scale:1,rotate:0,x:0,y:0,flip:false,z:CATS.indexOf(cat)}}
function figure(side,state=DB.dress[side],preview=false){return `<div class="figure" data-figure="${side}"><div class="silhouette"><div class="head"></div><div class="body"></div><div class="legs"></div></div>${Object.entries(state).sort((a,b)=>(a[1].z??0)-(b[1].z??0)).map(([cat,obj])=>{let c=getC(obj.id);let src=c?.items[cat]?.image;if(!src)return '';let transform=`translate(calc(-50% + ${obj.x||0}px),calc(-50% + ${obj.y||0}px)) rotate(${obj.rotate||0}deg) scale(${obj.flip?-1:1},1) scale(${obj.scale||1})`;return `<img class="layerimg ${!preview&&dressSelected===side+':'+cat?'selected':''}" data-layer="${side}:${cat}" style="transform:${transform};z-index:${10+(obj.z??0)}" src="${attr(src)}" alt="${esc(cat)}">`}).join('')}<span class="figurelabel">${side==='left'?'♡ LEFT':'♡ RIGHT'}</span></div>`}
function dressPage(){let available=DB.coords.filter(c=>!!c.items[selectedCat]?.image&&cats(c).includes(selectedCat));let selected=dressSelected?extractLayer(dressSelected):null;let d=selected?DB.dress[selected.side][selected.cat]:null;return `<div class="section" style="margin-top:2px"><h2>👗 きせかえステージ</h2><button class="help" data-act="resetDress">全てはずす</button></div><p class="note">左右に同じアイテムを着せてもOK。画像をタップして動かせるよ。</p><div class="dressstage">${figure('left')}${figure('right')}</div><div class="pilltabs" style="margin-top:10px">${pill('♡ LEFT','side:left',selectedSide==='left')}${pill('♡ RIGHT','side:right',selectedSide==='right')}</div><div class="pilltabs" style="margin:12px 0">${CATS.map(cat=>pill(EMO[cat]+' '+cat,'cat:'+cat,selectedCat===cat)).join('')}</div><div class="row between"><strong>着せるアイテム</strong><span class="sub">${available.length}件</span></div>${available.length?`<div class="inline-list">${available.map(c=>`<button class="itemcard" style="min-width:96px;width:96px" data-act="wear:${selectedSide}:${selectedCat}:${c.id}"><div class="thumb">${imgHTML(c.items[selectedCat].image)}</div><div class="name">${esc(c.name)}</div></button>`).join('')}</div>`:`<div class="empty">このカテゴリにはまだ画像がないよ。登録画面から追加してね。</div>`}${DB.dress[selectedSide][selectedCat]?`<div class="row between">${button('✕ このアイテムを外す','unwear:'+selectedSide+':'+selectedCat,'alt sm')}${button('🎛️ 選択して調整','selectLayer:'+selectedSide+':'+selectedCat,'alt sm')}</div>`:''}${d?`<div class="editcontrols" style="margin-top:12px"><div class="row between"><strong>🎛️ ${selected.cat}を調整</strong>${button('反転','flip','alt sm')}</div>${[['scale','大きさ',.3,2.7,.05],['rotate','角度',-180,180,5],['x','左右',-130,130,2],['y','上下',-180,180,2],['z','重なり順',0,20,1]].map(([field,label,min,max,step])=>`<div class="row" style="margin:7px 0"><label style="width:63px;font-size:11px">${label}</label><input class="range grow" type="range" data-range="${field}" min="${min}" max="${max}" step="${step}" value="${d[field]??(field==='scale'?1:0)}"><span style="font-size:11px;width:33px;text-align:right">${Number(d[field]??0).toFixed(field==='scale'?2:0)}</span></div>`).join('')}</div>`:''}<div class="panel row between" style="margin-top:14px"><div><strong>オリジナルコーデ</strong><div class="sub">左右2着を一緒に保存</div></div>${button('📖 BOOKに保存','saveBook')}</div>`}
function extractLayer(k){let [side,cat]=k.split(':');return {side,cat}}
function minePage(){return `<div class="section"><h2>💝 マイページ</h2></div><div class="menu" style="margin-top:0"><button class="tile" data-act="collections"><span class="gi">💝</span><strong>マイコレクション</strong><small>コーデ・アイテム</small></button><button class="tile" data-act="book"><span class="gi">📖</span><strong>オリジナルBOOK</strong><small>作ったコーデを管理</small></button></div><div class="panel"><div class="section" style="margin-top:0"><h2>📦 データの保管</h2></div><p class="note">この端末のSafari内に保存されています。Safariのデータ消去や機種変更に備えて、定期的にバックアップしてください。</p>${button('⬇ バックアップを書き出す','export','alt')} ${button('⬆ バックアップを復元','import','alt')}<input style="display:none" id="importFile" type="file" accept="application/json,.json"></div><div class="panel"><strong>登録状況</strong><p class="note">コーデ：${DB.coords.length}件 ／ アイテム：${allItems().length}件 ／ BOOK：${DB.book.length}件</p></div>`}
function collPage(){return `<div class="row between"><h2>💝 マイコレクション</h2>${button('＋ 新しいコレクション','newColl','sm')}</div><p class="note">同じコーデやアイテムを複数のコレクションに入れられるよ。</p>${DB.collections.length?DB.collections.map(c=>`<div class="collectionbox"><div class="row between"><strong>${esc(c.icon)} ${esc(c.name)}</strong><div>${button('編集','editColl:'+c.id,'alt sm')} ${button('開く','showColl:'+c.id,'sm')}</div></div><div class="sub">${c.refs.length}件</div></div>`).join(''):`<div class="empty">＋ を押して、最初のコレクションを作ろう</div>`}`}
function collDetail(c){let arr=c.refs.map(ref=>{let [type,...parts]=ref.split(':');let id=parts[0],cat=parts[1],coord=getC(id);return coord?{type,c:coord,cat,ref}:null}).filter(Boolean);if(c.sort==='name')arr.sort((a,b)=>a.c.name.localeCompare(b.c.name,'ja'));if(c.sort==='new')arr.reverse();return `<div class="row between"><h2>${esc(c.icon)} ${esc(c.name)}</h2><button class="close" data-act="close">×</button></div><div class="cardgrid">${arr.map(o=>`<div>${o.type==='coord'?coordCard(o.c):itCard(o.c,o.cat)}<button class="quick" style="margin-top:5px;width:100%" data-act="removeColl:${c.id}:${o.ref}">− 外す</button></div>`).join('')}</div>${arr.length?'':'<p class="empty">まだ何も入っていません</p>'}`}
function bookPage(){let books=DB.book.filter(b=>{let groupOK=bookGroup==='all'||b.groups?.includes(bookGroup);if(!groupOK)return false;let q=bookQuery.trim();if(!q)return true;let base=[b.name,b.tags,b.memo,b.color.join(' ')].join(' ');if(matches(q,base))return true;return ['left','right'].some(side=>Object.entries(b.dress[side]||{}).some(([cat,r])=>(bookPart==='all'||cat===bookPart)&&matches(q,([getC(r.id)?.name,cat,getC(r.id)?.items[cat]?.tags,getC(r.id)?.items[cat]?.memo].join(' '))))) });return `<div class="row between"><h2>📖 オリジナルコーデBOOK</h2>${button('分類を作る','newBookGroup','alt sm')}</div><div class="filters"><input class="search" id="bookSearch" value="${attr(bookQuery)}" placeholder="作品名・使用アイテム名・タグ・メモ"></div><div class="settitle">使ったアイテムの部位で検索</div><div class="pilltabs">${[['all','すべて'],...CATS.map(c=>[c,c])].map(([id,t])=>pill(t,'bookPart:'+id,bookPart===id)).join('')}</div><div class="settitle">保存先</div><div class="pilltabs">${pill('すべて','bookGroup:all',bookGroup==='all')}${DB.bookGroups.map(g=>pill(g.icon+' '+g.name,'bookGroup:'+g.id,bookGroup===g.id)).join('')}</div><p class="sub">${books.length}件</p>${books.length?books.slice().reverse().map(b=>`<button class="collectionbox" data-act="bookDetail:${b.id}" style="width:100%;text-align:left"><div class="row between"><strong>📖 ${esc(b.name)}</strong><span class="sub">${new Date(b.created).toLocaleDateString('ja-JP')}</span></div><div class="tagline">${esc(b.tags||b.memo||'タップして詳細を見る')}</div></button>`).join(''):`<div class="empty">作品が見つかりません。着せ替えを保存するとここに表示されるよ。</div>`}`}
function bookDetail(b){return `<div class="row between"><h2>📖 ${esc(b.name)}</h2><button class="close" data-act="close">×</button></div><div class="bookpreview">${figure('left',b.dress.left,true)}${figure('right',b.dress.right,true)}</div><div class="filterbar">${b.color.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}${b.tags.split(',').filter(Boolean).map(c=>`<span class="chip">#${esc(c)}</span>`).join('')}</div>${b.memo?`<p class="note">${esc(b.memo)}</p>`:''}<div class="settitle">使用アイテム</div>${['left','right'].map(s=>`<div class="collectionbox"><strong>${s==='left'?'♡ LEFT':'♡ RIGHT'}</strong>${Object.entries(b.dress[s]).map(([cat,r])=>`<div class="listrow"><span>${EMO[cat]}</span><span class="grow">${esc(cat)}：${esc(getC(r.id)?.name||'削除済み')}</span></div>`).join('')}</div>`).join('')}${button('✎ タグ・分類を編集','editBook:'+b.id,'alt')} ${button('↩ この組合せを着せ替えで開く','loadBook:'+b.id,'alt')}<div class="divider"></div>${button('この作品を削除','deleteBook:'+b.id,'ghost sm')}`}
function modalHTML(){let html='';if(modal.type==='detail')html=detailPage(getC(modal.id));else if(modal.type==='item'){let c=getC(modal.id);html=itemDetail(c,modal.cat)}else if(modal.type==='qr'){let c=getC(modal.id),it=c?.items[modal.cat];html=`<div class="row between"><h2>QR画像｜${esc(c?.name)}</h2><button class="close" data-act="close">×</button></div><p class="note">${esc(modal.cat)}</p>${it?.qr?`<img class="bigqr" src="${attr(it.qr)}" alt="登録されたQR画像">`:'<div class="empty">QRはまだ登録されていません</div>'}${button('✎ 画像を登録・変更','edit:'+modal.id,'alt')}`}else if(modal.type==='pinPicker')html=`<div class="row between"><h2>🏠 ホームに飾るコーデ</h2><button class="close" data-act="close">×</button></div><p class="note">タップして選択。最大8件まで飾れます。</p>${DB.coords.map(c=>`<label class="listrow"><input type="checkbox" data-pin="${c.id}" ${DB.homePins.includes(c.id)?'checked':''}><div class="thumb" style="height:48px;width:43px;flex-shrink:0">${imgHTML(c.cover||cats(c).map(k=>c.items[k].image).find(Boolean))}</div><span class="grow">${esc(c.name)}</span></label>`).join('')}${button('決定','savePins')}`;else if(modal.type==='backup')html=`<div class="row between"><h2>📦 バックアップ</h2><button class="close" data-act="close">×</button></div><p class="note">画像・QR・コーデ・BOOK・コレクションをまとめてJSONで保存します。バックアップにはQR情報が含まれるので他人に送らないでください。</p>${button('⬇ 書き出す','export')} ${button('⬆ 復元する','import','alt')}<input style="display:none" id="importFile" type="file" accept="application/json,.json">`;else if(modal.type==='help')html=`<div class="row between"><h2>❔ 使い方</h2><button class="close" data-act="close">×</button></div><p>①「登録」でコーデ名を入力（写真なしでもOK）</p><p>② コーデ一覧から所持状況・QRを確認</p><p>③「きせかえ」で左右にアイテムを選択</p><p>④ BOOKに保存して自由に探そう</p><p class="note">写真とQRはこの端末内だけに保存されます。Safariの履歴やWebサイトデータを消すと失われることがあるので、バックアップをおすすめします。</p>`;else if(modal.type==='collections')html=collPage();else if(modal.type==='collForm'){let c=modal.id?DB.collections.find(x=>x.id===modal.id):{name:'',icon:'💝',sort:'manual'};html=`<div class="row between"><h2>${modal.id?'編集':'新しいコレクション'}</h2><button class="close" data-act="close">×</button></div><div class="field"><label>名前</label><input id="collName" value="${attr(c.name)}" placeholder="例：お気に入りのドレス"></div><div class="field"><label>アイコン（絵文字）</label><input id="collIcon" value="${attr(c.icon)}" maxlength="12"></div><div class="field"><label>並び順</label><select id="collSort"><option value="manual" ${c.sort==='manual'?'selected':''}>追加した順</option><option value="new" ${c.sort==='new'?'selected':''}>追加した新しい順</option><option value="name" ${c.sort==='name'?'selected':''}>名前順</option></select></div>${button('保存する','saveColl')}${modal.id?' '+button('削除','deleteColl:'+modal.id,'ghost sm'):''}`}else if(modal.type==='collDetail')html=collDetail(DB.collections.find(c=>c.id===modal.id));else if(modal.type==='addColl'){let {kind,id}=modal;html=`<div class="row between"><h2>💝 コレクションに追加</h2><button class="close" data-act="close">×</button></div><p class="note">複数選べるよ</p>${DB.collections.map(c=>`<label class="listrow"><input type="checkbox" data-collref="${c.id}" ${c.refs.includes(kind+':'+id)?'checked':''}><strong>${esc(c.icon)} ${esc(c.name)}</strong></label>`).join('')}${DB.collections.length?'':'<p class="note">先にマイページからコレクションを作成してください。</p>'}${button('決定','saveAddColl')}`}else if(modal.type==='book')html=bookPage();else if(modal.type==='bookDetail'){let b=DB.book.find(x=>x.id===modal.id);html=b?bookDetail(b):'<p>作品が見つかりません</p>'}else if(modal.type==='bookForm'){let b=modal.id?DB.book.find(x=>x.id===modal.id):null;html=`<div class="row between"><h2>📖 ${b?'BOOKを編集':'BOOKに保存'}</h2><button class="close" data-act="close">×</button></div><div class="field"><label>作品名</label><input id="bookName" value="${attr(b?.name||'マイコーデ '+(DB.book.length+1))}"></div><div class="field"><label>カラータグ（カンマ区切り）</label><input id="bookColor" value="${attr(b?.color?.join(',')||'')}"></div><div class="field"><label>オリジナルタグ（カンマ区切り）</label><input id="bookTags" value="${attr(b?.tags||'')}"></div><div class="field"><label>メモ</label><textarea id="bookMemo">${esc(b?.memo||'')}</textarea></div><div class="settitle">分類（複数選択OK）</div>${DB.bookGroups.map(g=>`<label class="listrow"><input type="checkbox" data-bookgroup="${g.id}" ${(b?.groups||[]).includes(g.id)?'checked':''}>${esc(g.icon)} ${esc(g.name)}</label>`).join('')}${button('♡ 保存する','commitBook')}`}else if(modal.type==='bookGroupForm')html=`<div class="row between"><h2>BOOKの分類を作る</h2><button class="close" data-act="close">×</button></div><div class="field"><label>分類名</label><input id="groupName" placeholder="例：春のコーデ"></div><div class="field"><label>アイコン</label><input id="groupIcon" value="📔"></div>${button('追加する','saveBookGroup')}`;return `<div class="modalback" data-backdrop="1"><div class="modal">${html}</div></div>`}
function show(m){modal=m;render()}
function saveRefresh(msg='保存したよ'){persist();render();message(msg)}
async function handlePhoto(el){let file=el.files?.[0];if(!file)return;try{let v=await fileData(file,el.dataset.photo.startsWith('qr:')?1600:1100);let [type,cat]=el.dataset.photo.split(':');if(type==='cover')draft.cover=v;else draft.items[cat][type]=v;if(type==='image'||type==='cover'){const color=guessColor(draft.name,v);if(color&&!(type==='cover'?draft.color:draft.items[cat].color).length)(type==='cover'?draft.color:draft.items[cat].color).push(color)}render();message('画像を追加したよ')}catch(e){message(e.message)}}
function guessColor(name,data){for(let c of Object.keys(COLORS)){if(name.includes(c))return c}for(let [s,c] of [['ピンク','ピンク'],['レッド','赤'],['ブルー','青'],['イエロー','黄色'],['グリーン','緑'],['パープル','紫'],['ホワイト','白'],['ブラック','黒']])if(name.includes(s))return c;if(!data)return null;try{let cv=document.createElement('canvas');cv.width=1;cv.height=1;let ctx=cv.getContext('2d');let image=new Image();image.src=data;if(!image.complete)return null;ctx.drawImage(image,0,0,1,1);let [r,g,b,a]=ctx.getImageData(0,0,1,1).data;if(a<90)return null;if(Math.max(r,g,b)-Math.min(r,g,b)<23)return r>205?'白':r<70?'黒':'グレー';if(r>g*1.22&&r>b*1.17)return r>170&&b>100?'ピンク':'赤';if(b>r*1.3&&b>g*1.1)return '青';if(g>r*1.22&&g>b*.99)return '緑';if(r>165&&g>145&&b<125)return '黄色';return null}catch{return null}}
function download(filename,content){let blob=new Blob([content],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportData(){download('きらめきクローゼット_バックアップ_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'kirameki-closet',exported:new Date().toISOString(),data:DB}));message('バックアップを書き出したよ')}
async function importData(file){try{let text=await file.text(),data=JSON.parse(text);if(data.app!=='kirameki-closet'||!Array.isArray(data.data?.coords))throw Error('このアプリのバックアップではありません');if(!confirm('現在の保存データをバックアップの内容で置き換えます。先に現在のデータを書き出しましたか？'))return;DB={...empty(),...data.data};await persist();modal=null;draft=null;go('home');message('復元が完了したよ')}catch(e){message('復元できません：'+e.message)}}
function getTargetColor(prefix){let p=prefix.split(':');if(p[0]==='coord')return draft.color;if(p[0]==='item')return draft.items[p[1]].color;return []}
async function act(a){let p=a.split(':'),kind=p[0];if(kind==='nav'){if(draft&&tab==='register'&&!confirm('保存前の入力を閉じますか？'))return;draft=null;go(p[1]);return}if(kind==='new'){newDraft();return}if(kind==='style'){readDraft();draft.style=p[1];render();return}if(kind==='next1'){readDraft();if(!draft.name.trim()){message('コーデ名を入力してね');return}let dup=DB.coords.find(c=>c.id!==draft.id&&norm(c.name)===norm(draft.name));if(dup){show({type:'detail',id:dup.id});message('同じ名前の登録があります。既存の内容を編集してください');return}if(!draft.color.length){let color=guessColor(draft.name,'');if(color)draft.color=[color]}editStep=2;render();return}if(kind==='next2'){readDraft();editStep=3;render();return}if(kind==='back2'){readDraft();editStep=1;render();return}if(kind==='back3'){readDraft();editStep=2;render();return}if(kind==='cancel'){if(confirm('入力を終了しますか？')){draft=null;go('home')}return}if(kind==='color'){readDraft();let colors=getTargetColor(p.slice(1,-1).join(':')),value=p[p.length-1],i=colors.indexOf(value);if(i>=0)colors.splice(i,1);else colors.push(value);render();return}if(kind==='saveCoord'){readDraft();draft.updated=Date.now();let ix=DB.coords.findIndex(c=>c.id===draft.id);if(ix>=0){DB.coords[ix]=draft}else DB.coords.push(draft);let id=draft.id;draft=null;editing=false;await persist();go('list');show({type:'detail',id});message('コーデを保存したよ');return}if(kind==='edit'){let c=getC(p[1]);if(!c)return;modal=null;newDraft(c);return}if(kind==='detail'){show({type:'detail',id:p[1]});return}if(kind==='item'){show({type:'item',id:p[1],cat:p[2]});return}if(kind==='qr'){show({type:'qr',id:p[1],cat:p[2]});return}if(kind==='coordFlag'){let c=getC(p[1]);c[p[2]]=!c[p[2]];saveRefresh();return}if(kind==='itemFlag'){let c=getC(p[1]);let it=c.items[p[2]];it[p[3]]=!it[p[3]];saveRefresh();return}if(kind==='close'){modal=null;render();return}if(kind==='pinPicker'){show({type:'pinPicker'});return}if(kind==='pin'){let i=DB.homePins.indexOf(p[1]);if(i>=0)DB.homePins.splice(i,1);else if(DB.homePins.length<8)DB.homePins.push(p[1]);else{message('飾れるのは8件まで');return}saveRefresh();return}if(kind==='savePins'){let ids=[...document.querySelectorAll('[data-pin]:checked')].map(x=>x.dataset.pin);if(ids.length>8){message('8件まで選んでね');return}DB.homePins=ids;modal=null;saveRefresh();return}if(kind==='listType'){listType=p[1];render();return}if(kind==='filter'){listFilter=p[1];render();return}if(kind==='clearSearch'){query='';render();return}if(kind==='side'){selectedSide=p[1];dressSelected=null;render();return}if(kind==='cat'){selectedCat=p[1];dressSelected=null;render();return}if(kind==='wear'){let side=p[1],cat=p[2],id=p[3];DB.dress[side][cat]=layer(cat,{id});selectedSide=side;dressSelected=side+':'+cat;saveRefresh('着せたよ！');return}if(kind==='unwear'){delete DB.dress[p[1]][p[2]];dressSelected=null;saveRefresh();return}if(kind==='selectLayer'){dressSelected=p[1]+':'+p[2];render();return}if(kind==='flip'){if(!dressSelected)return;let {side,cat}=extractLayer(dressSelected);DB.dress[side][cat].flip=!DB.dress[side][cat].flip;saveRefresh();return}if(kind==='resetDress'){if(confirm('左右のきせかえをすべて外しますか？')){DB.dress={left:{},right:{}};dressSelected=null;saveRefresh()}return}if(kind==='saveBook'){if(!Object.keys(DB.dress.left).length&&!Object.keys(DB.dress.right).length){message('先にアイテムを着せてね');return}show({type:'bookForm'});return}if(kind==='commitBook'){let isEdit=!!modal.id;let b=isEdit?DB.book.find(b=>b.id===modal.id):{id:uid(),created:Date.now(),dress:structuredClone(DB.dress)};b.name=$('bookName').value.trim()||'マイコーデ';b.color=$('bookColor').value.split(',').map(x=>x.trim()).filter(Boolean);b.tags=$('bookTags').value;b.memo=$('bookMemo').value;b.groups=[...document.querySelectorAll('[data-bookgroup]:checked')].map(x=>x.dataset.bookgroup);if(!isEdit)DB.book.push(b);modal=null;saveRefresh('BOOKに保存したよ');return}if(kind==='book'){show({type:'book'});return}if(kind==='bookDetail'){show({type:'bookDetail',id:p[1]});return}if(kind==='bookPart'){bookPart=p[1];render();return}if(kind==='bookGroup'){bookGroup=p[1];render();return}if(kind==='editBook'){show({type:'bookForm',id:p[1]});return}if(kind==='loadBook'){let b=DB.book.find(b=>b.id===p[1]);DB.dress=structuredClone(b.dress);dressSelected=null;go('dress');saveRefresh('着せ替えに読み込んだよ');return}if(kind==='deleteBook'){if(!confirm('このBOOK作品を削除しますか？'))return;DB.book=DB.book.filter(b=>b.id!==p[1]);show({type:'book'});saveRefresh();return}if(kind==='newBookGroup'){show({type:'bookGroupForm'});return}if(kind==='saveBookGroup'){let name=$('groupName').value.trim();if(!name)return message('名前を入れてね');DB.bookGroups.push({id:uid(),name,icon:$('groupIcon').value||'📔'});show({type:'book'});saveRefresh();return}if(kind==='collections'){show({type:'collections'});return}if(kind==='newColl'){show({type:'collForm'});return}if(kind==='editColl'){show({type:'collForm',id:p[1]});return}if(kind==='saveColl'){let name=$('collName').value.trim();if(!name)return message('名前を入れてね');if(modal.id){let c=DB.collections.find(c=>c.id===modal.id);c.name=name;c.icon=$('collIcon').value||'💝';c.sort=$('collSort').value}else DB.collections.push({id:uid(),name,icon:$('collIcon').value||'💝',sort:$('collSort').value,refs:[]});show({type:'collections'});saveRefresh();return}if(kind==='deleteColl'){if(!confirm('このコレクションを削除しますか？（元のコーデは消えません）'))return;DB.collections=DB.collections.filter(c=>c.id!==p[1]);show({type:'collections'});saveRefresh();return}if(kind==='showColl'){show({type:'collDetail',id:p[1]});return}if(kind==='addColl'){show({type:'addColl',kind:p[1],id:p.slice(2).join(':')});return}if(kind==='saveAddColl'){let ref=modal.kind+':'+modal.id;let ids=[...document.querySelectorAll('[data-collref]:checked')].map(el=>el.dataset.collref);DB.collections.forEach(c=>{if(ids.includes(c.id)&&!c.refs.includes(ref))c.refs.push(ref);if(!ids.includes(c.id))c.refs=c.refs.filter(r=>r!==ref)});modal=null;saveRefresh('コレクションを更新したよ');return}if(kind==='removeColl'){let c=DB.collections.find(c=>c.id===p[1]);let ref=p.slice(2).join(':');c.refs=c.refs.filter(x=>x!==ref);saveRefresh();return}if(kind==='backupMenu'){show({type:'backup'});return}if(kind==='help'){show({type:'help'});return}if(kind==='export'){exportData();return}if(kind==='import'){let f=$('importFile');if(f)f.click();else{show({type:'backup'});setTimeout(()=>$('importFile')?.click(),50)}return}}
function bind(){document.addEventListener('click',e=>{let x=e.target.closest('[data-act]');if(x){e.preventDefault();act(x.dataset.act)}else if(e.target.dataset.backdrop){modal=null;render()}});document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.photo){await handlePhoto(el);return}if(el.id==='importFile'&&el.files[0]){await importData(el.files[0]);return}if(el.dataset.field){readDraft();return}if(el.id==='sort'){listSort=el.value;render();return}});document.addEventListener('input',e=>{let el=e.target;if(el.id==='searchInput'){query=el.value;let pos=el.selectionStart;let focused=true;let sc=$('screen').scrollTop;render();$('screen').scrollTop=sc;let n=$('searchInput');n.focus();n.setSelectionRange(pos,pos);return}if(el.id==='bookSearch'){bookQuery=el.value;let pos=el.selectionStart;render();let n=$('bookSearch');n.focus();n.setSelectionRange(pos,pos);return}if(el.dataset.range&&dressSelected){let {side,cat}=extractLayer(dressSelected);DB.dress[side][cat][el.dataset.range]=Number(el.value);let fig=document.querySelector(`.figure[data-figure="${side}"] .layerimg[data-layer="${side}:${cat}"]`);if(fig){let d=DB.dress[side][cat];fig.style.transform=`translate(calc(-50% + ${d.x||0}px),calc(-50% + ${d.y||0}px)) rotate(${d.rotate||0}deg) scale(${d.flip?-1:1},1) scale(${d.scale||1})`;fig.style.zIndex=10+(d.z||0)}el.nextElementSibling.textContent=String(Number(el.value).toFixed(el.dataset.range==='scale'?2:0));persist();return}if(el.id==='regName'||el.id==='regNumber'){readDraft();let box=$('candidate');if(box)box.innerHTML=candidates()}})}
function pointerSetup(){let drag=null;document.addEventListener('pointerdown',e=>{let el=e.target.closest('.layerimg');if(!el||tab!=='dress')return;let [side,cat]=el.dataset.layer.split(':');if(!DB.dress[side]?.[cat])return;selectedSide=side;selectedCat=cat;dressSelected=side+':'+cat;let d=DB.dress[side][cat];drag={id:e.pointerId,side,cat,x:e.clientX,y:e.clientY,ox:d.x||0,oy:d.y||0};el.setPointerCapture(e.pointerId);el.classList.add('selected')});document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let d=DB.dress[drag.side]?.[drag.cat];if(!d)return;d.x=Math.max(-130,Math.min(130,Math.round(drag.ox+e.clientX-drag.x)));d.y=Math.max(-180,Math.min(180,Math.round(drag.oy+e.clientY-drag.y)));let el=document.querySelector(`[data-layer="${drag.side}:${drag.cat}"]`);if(el)el.style.transform=`translate(calc(-50% + ${d.x}px),calc(-50% + ${d.y}px)) rotate(${d.rotate||0}deg) scale(${d.flip?-1:1},1) scale(${d.scale||1})`});document.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId){drag=null;persist();render()}})}
(async()=>{try{db=await openDB();DB={...empty(),...((await getStored())||{})};DB.dress??={left:{},right:{}};DB.dress.left??={};DB.dress.right??={};DB.collections??=[];DB.bookGroups??=[];DB.book??=[];DB.homePins??=[];bind();pointerSetup();render()}catch(e){$('screen').innerHTML=`<div class="error">保存領域を開けませんでした。Safariのプライベートブラウズや容量設定をご確認ください。<br>${esc(e.message)}</div>`}})();
</script></body></html>
