function card(x){if(x.coord)return `<button class="item" data-detail="${clean(x.id)}">${x.image?`<div class="art"><img src="${x.image}" alt=""></div>`:`<div class="art" style="--a:${COLORS[x.color]}">👚</div>`}<div class="flag">${x.owned?'✓ 所持':'未所持'} · ${x.label}</div><strong>${clean(x.name)}</strong><div class="tiny">${clean(x.color)}</div></button>`;return `<button class="item" data-detail="${clean(x.id)}">${imageArt(x)}<div class="flag">${x.owned?'✓ 所持':'未所持'} ${x.wish?'♡':''} ${x.favorite?'☆':''}</div><strong>${clean(x.name)}</strong><div class="tiny">${clean(x.edition)} · ${clean(x.color)}</div></button>`}
function go(t){tab=t;render();$('#view').scrollTop=0}function nav(){ $('#nav').innerHTML=Object.entries(NAV).map(([k,[i,n]])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><span>${i}</span>${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function home(){return `<div class="hero"><div class="emoji">🎀 ✨ 👗</div><h2>コーデをさがして、きせかえよう♡</h2><div class="hint">左右2つのコーデを作れるよ！</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="go('search')">コーデをさがす</button><button class="btn secondary" onclick="go('dress')">ペアきせかえ</button></div></div><div class="stats"><div class="stat"><small>収録名</small><b>${data.items.length}</b></div><div class="stat"><small>所持コーデ</small><b>${data.items.filter(x=>x.owned).length}</b></div><div class="stat"><small>BOOK作品</small><b>${data.books.length}</b></div></div><div class="panel"><div class="title">✦ 現在の収録状況</div><div class="notice">公式ページで確認した「おねがい4だん」のコーデ名を${CATALOG.length}件収録。全シリーズ・公式画像・部位別の公式画像の取り込みは<b>未完了</b>。未確認の部位データは作らず、自分で画像や部位を追加できるようにしています。</div><div class="actionbar"><button class="pill" id="export">⬇ バックアップ保存</button><button class="pill" id="import">⬆ バックアップ復元</button><input id="importfile" type="file" accept="application/json" hidden></div><p class="smallnote">ブラウザの保存データが消える場合があるため、定期的なバックアップをおすすめします。</p><a href="https://aipri.jp/verse/item/oa4.html" target="_blank" rel="noopener" style="font-size:12px">コーデ公式ページを開く</a></div><div class="panel"><div class="title">♡ コーデをみる</div><div class="grid">${data.items.slice(0,6).map(card).join('')}</div></div>`}
function searchView(collection){const arr=allResults().filter(x=>!collection||x.coord?.owned||x.owned||x.wish||x.favorite||Object.values(x.parts||{}).some(p=>p.owned));return `<div class="panel"><div class="title">${collection?'♡ マイコレクション':'✦ コーデ・アイテムをさがす'}</div><div class="row"><button class="pill ${display==='coord'?'active':''}" data-display="coord">👗 コーデごと</button><button class="pill ${display==='parts'?'active':''}" data-display="parts">🎀 アイテムごと</button></div><div class="lab">名前・タグ・メモで検索</div><input id="q" class="field" placeholder="名前・タグ・メモ　-除外ワード" value="${clean(query)}"><div class="lab">カラー</div><div class="tags">${Object.keys(COLORS).map(c=>`<button data-color="${c}" class="pill ${filterColor===c?'active':''}"><span class="swatch" style="background:${COLORS[c]}"></span> ${c}</button>`).join('')}<button data-color="すべて" class="pill ${filterColor==='すべて'?'active':''}">すべて</button></div><div class="lab">シリーズ</div><select id="series" class="field">${['すべて','アイプリバース','おねがいアイプリ','ひみつのアイプリ','手動追加'].map(s=>`<option ${seriesFilter===s?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:9px"><label class="tiny"><input type="checkbox" id="ownedonly" ${filterOwned?'checked':''}> 所持のみ</label><button class="pill" id="additem" style="margin-left:auto">＋ 新規コーデ</button></div></div><div class="sectionhead">${display==='coord'?'コーデ一覧':'アイテム一覧'} <span class="counter">${arr.length}件</span></div>${display==='parts'?'<p class="hint">部位を設定したアイテムのみ表示。コーデ詳細から各部位の名前・画像・所持を登録できます。</p>':''}${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">一致するデータがありません</div>'}`}
function stage(sideIndex){const d=data.dress[sideIndex]||{};return `<button data-side="${sideIndex}" class="stagebox ${sideIndex===side?'selected':''}" aria-label="${sideIndex?'右':'左'}の着せ替えを編集"><div class="stagehead">${sideIndex?'右':'左'} ${sideIndex===side?'✦選択中':''}</div><div class="model">🧍</div>${Object.entries(CATS).map(([cat,label])=>{const o=d[cat];if(!o)return '';const x=data.items.find(x=>x.id===o.id);if(!x)return '';const src=partImage(x,cat);return `<div class="layer ${cat}">${src?`<img src="${src}" alt="${clean(label)}">`:`<span>${clean(label)}<br>${clean(x.name)}</span>`}</div>`}).join('')}</button>`}
function dressView(){const wear=data.dress[side]||{};const choices=data.items.filter(x=>x.parts?.[dressCat]?.enabled);return `<div class="title">✦ ペアきせかえ</div><p class="hint">左右をタップして編集する側を選択。同じアイテムを左右両方に着せられます。</p><div class="stage">${stage(0)}${stage(1)}</div><div class="panel" style="margin-top:13px"><div class="row between"><b>${side?'右':'左'}のアイテムを選ぶ</b><button class="pill" id="clearSide">${side?'右':'左'}をクリア</button></div><div class="selectwrap" style="margin:12px 0">${Object.entries(CATS).map(([cat,label])=>`<button class="pill ${dressCat===cat?'active':''}" data-cat="${cat}">${label}</button>`).join('')}</div><div class="hint">各コーデの詳細で部位を登録したら選べます。画像未登録の部位は名前で仮表示。</div><div class="dresslist">${choices.map(x=>`<button class="dressopt ${wear[dressCat]?.id===x.id?'selected':''}" data-wear="${x.id}">${partImage(x,dressCat)?`<div class="art"><img src="${partImage(x,dressCat)}"></div>`:imageArt(x)}${clean(x.name)}</button>`).join('')||'<div class="empty">まだ部位が未登録です。コーデ詳細でアイテムを設定してね。</div>'}</div><div class="actionbar"><button class="pill" id="removePart">この部位をはずす</button><button class="btn" id="savebook">♡ BOOKに保存</button><button class="btn secondary" id="savepic">画像保存</button></div></div>`}
function bookView(){return `<div class="title">♡ マイコーデBOOK</div><p class="hint">左右の着せ替えを1作品として保存。あとから再編集できます。</p>${data.books.length?data.books.slice().reverse().map(b=>`<div class="bookcard"><strong>${clean(b.name)}</strong><span class="tiny">　${clean(b.date)}</span><div class="bookpreview">${(b.pair||[{},{}]).map((side,i)=>`<div><b>${i?'右':'左'}</b><div>👗</div>${Object.entries(side).map(([cat,part])=>`<div>${clean(CATS[cat])}：${clean(data.items.find(x=>x.id===part.id)?.name||'')}</div>`).join('')}</div>`).join('')}</div><div class="row"><button class="btn small" data-load="${clean(b.id)}">編集する</button><button class="pill" data-delete="${clean(b.id)}">削除</button></div></div>`).join(''):'<div class="panel empty">保存作品はまだありません</div>'}`}
function render(){nav();$('#view').innerHTML={home:home,search:()=>searchView(false),collection:()=>searchView(true),dress:dressView,book:bookView}[tab]();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openItem(b.dataset.detail));document.querySelectorAll('[data-display]').forEach(b=>b.onclick=()=>{display=b.dataset.display;render()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{filterColor=b.dataset.color;render()});if($('#q')){const q=$('#q');q.oninput=()=>{query=q.value;const p=q.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)};$('#series').onchange=e=>{seriesFilter=e.target.value;render()};$('#ownedonly').onchange=e=>{filterOwned=e.target.checked;render()};$('#additem').onclick=()=>openItem(null)}document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=+b.dataset.side;render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{dressCat=b.dataset.cat;render()});document.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{data.dress[side][dressCat]={id:b.dataset.wear};if(dressCat==='dress'){delete data.dress[side].top;delete data.dress[side].bottom}else if(['top','bottom'].includes(dressCat))delete data.dress[side].dress;persist();render()});if($('#clearSide')){$('#clearSide').onclick=()=>{data.dress[side]={};persist();render()};$('#removePart').onclick=()=>{delete data.dress[side][dressCat];persist();render()};$('#savebook').onclick=saveBook;$('#savepic').onclick=savePicture}document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let book=data.books.find(x=>x.id===b.dataset.load);data.dress=JSON.parse(JSON.stringify(book.pair||[{},{}]));persist();go('dress')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('作品を削除しますか？')){data.books=data.books.filter(x=>x.id!==b.dataset.delete);persist();render()}});if($('#export')){$('#export').onclick=exportBackup;$('#import').onclick=()=>$('#importfile').click();$('#importfile').onchange=importBackup}}
function openItem(id){modalId=id;let x=data.items.find(x=>x.id===id)||{name:'',color:'未設定',edition:'',series:'手動追加',rarity:'',image:'',parts:emptyParts(),owned:false,wish:false,favorite:false,tags:'',memo:''};let original=!!id;$('#modalhost').innerHTML=`<div class="modalbg" id="bg"><div class="modal"><div class="row between"><div class="title">${original?'コーデ・アイテム詳細':'新規コーデ登録'}</div><button class="pill" id="close">✕ とじる</button></div>${imageArt(x)}<div class="lab">コーデ名</div><input id="iname" class="field" value="${clean(x.name)}"><div class="row"><div style="flex:1"><div class="lab">カラー</div><select class="field" id="icolor">${Object.keys(COLORS).map(c=>`<option ${x.color===c?'selected':''}>${c}</option>`).join('')}</select></div><div style="flex:1"><div class="lab">登場弾</div><input class="field" id="iedition" value="${clean(x.edition)}"></div></div><div class="lab">コーデ全体の画像</div><input class="field" type="file" id="iphoto" accept="image/*"><div class="row" style="margin:12px 0"><label class="tiny"><input type="checkbox" id="iowned" ${x.owned?'checked':''}> コーデ所持</label><label class="tiny"><input type="checkbox" id="iwish" ${x.wish?'checked':''}> ♡ほしい</label><label class="tiny"><input type="checkbox" id="ifav" ${x.favorite?'checked':''}> ☆お気に入り</label></div><div class="lab">タグ</div><input class="field" id="itags" value="${clean(x.tags)}" placeholder="かわいい, ねこ, 冬"><div class="lab">メモ</div><textarea id="imemo" class="field" rows="2">${clean(x.memo)}</textarea><div class="title" style="margin-top:17px">🎀 アイテムを登録</div><p class="hint">部位ごとに画像・所持を登録。着せ替えではこの部位画像を重ねて表示します。背景透過PNGがおすすめ。</p>${Object.entries(CATS).map(([cat,label])=>{const p=x.parts?.[cat]||{};return `<div class="cardpart"><label><input type="checkbox" data-enabled="${cat}" ${p.enabled?'checked':''}> <b>${label}を使用</b></label><div class="row"><label class="tiny"><input type="checkbox" data-partowned="${cat}" ${p.owned?'checked':''}> 所持</label>${p.image?'<span class="tiny">✓画像登録済</span>':''}</div><input class="field" type="file" data-partimage="${cat}" accept="image/*" style="padding:6px;margin-top:5px"></div>`}).join('')}<div class="row" style="margin-top:14px"><button class="btn" id="isave">♡ 保存する</button>${original&&!id.startsWith('official-')?'<button class="btn ghost" id="idelete">削除</button>':''}</div>${x.sources?.length?`<p class="smallnote">出典：<a target="_blank" rel="noopener" href="${x.sources[0]}">公式掲載ページ</a></p>`:''}</div></div>`;$('#close').onclick=closeModal;$('#bg').onclick=e=>{if(e.target.id==='bg')closeModal()};$('#isave').onclick=async()=>{let name=$('#iname').value.trim();if(!name)return alert('名前を入力してね');const photo=await readImage($('#iphoto').files[0]);let parts={...emptyParts(),...x.parts};for(const cat of Object.keys(CATS)){const image=await readImage($(`[data-partimage="${cat}"]`).files[0]);parts[cat]={...(parts[cat]||{}),enabled:$(`[data-enabled="${cat}"]`).checked,owned:$(`[data-partowned="${cat}"]`).checked,...(image?{image}:{})}}let updated={...x,id:id||'custom-'+uid(),name,color:$('#icolor').value,edition:$('#iedition').value,image:photo||x.image,owned:$('#iowned').checked,wish:$('#iwish').checked,favorite:$('#ifav').checked,tags:$('#itags').value,memo:$('#imemo').value,parts};if(id)data.items[data.items.findIndex(y=>y.id===id)]=updated;else data.items.unshift(updated);if(!persist())return;closeModal();render()};if($('#idelete'))$('#idelete').onclick=()=>{if(confirm('削除しますか？')){data.items=data.items.filter(x=>x.id!==id);persist();closeModal();render()}}}
async function readImage(file){if(!file)return '';const bitmap=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=URL.createObjectURL(file)});const canvas=document.createElement('canvas');const scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/webp',.83)}function closeModal(){$('#modalhost').innerHTML=''}function saveBook(){if(!data.dress.some(x=>Object.keys(x).length))return alert('まず左右のどちらかにアイテムを選んでね');const name=prompt('作品名を入力してね','マイコーデ '+(data.books.length+1));if(name===null)return;data.books.push({id:'book-'+uid(),name:name.trim()||'マイコーデ',date:new Date().toLocaleDateString('ja-JP'),pair:JSON.parse(JSON.stringify(data.dress))});persist();alert('BOOKに保存したよ♡');render()}
async function savePicture(){const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1000;const c=canvas.getContext('2d');const bg=c.createLinearGradient(0,0,1000,1000);bg.addColorStop(0,'#d8f6ff');bg.addColorStop(1,'#ffe0f2');c.fillStyle=bg;c.fillRect(0,0,1000,1000);c.textAlign='center';c.fillStyle='#b8539f';c.font='bold 45px sans-serif';c.fillText('♡ MY COORD BOOK ♡',500,72);for(let i=0;i<2;i++){const off=i*500;c.fillStyle='#ffffff88';c.fillRect(off+18,110,464,820);c.fillStyle='#9c568f';c.font='bold 30px sans-serif';c.fillText(i?'右':'左',off+250,155);const positions={acc:[185,125],top:[325,205],bottom:[540,150],dress:[350,320],shoes:[725,115]};for(const cat of ['dress','top','bottom','shoes','acc']){const record=data.dress[i][cat];if(!record)continue;const x=data.items.find(x=>x.id===record.id);if(!x)continue;const [y,h]=positions[cat];const src=partImage(x,cat);if(src){try{const im=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src});const w=Math.min(370,im.width*h/im.height);c.drawImage(im,off+250-w/2,y,w,h)}catch(e){}}else{c.fillStyle='#9c568f';c.font='bold 16px sans-serif';c.fillText(CATS[cat]+'：'+x.name.slice(0,15),off+250,y+24)}}}canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nana-pair-coord.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png')}
function exportBackup(){const blob=new Blob([JSON.stringify({format:'nana-coord-room-v2',data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nana-coord-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function importBackup(e){try{const file=e.target.files[0];if(!file)return;const parsed=JSON.parse(await file.text());if(!parsed.data?.items||!Array.isArray(parsed.data.items)||!Array.isArray(parsed.data.books))throw Error('形式が違います');if(!confirm('現在のデータをバックアップデータで置き換えます。先に今のデータを保存しましたか？'))return;data=parsed.data;data.dress=Array.isArray(data.dress)&&data.dress.length===2?data.dress:[{},{}];persist();render();alert('復元しました')}catch(e){alert('バックアップを読み込めませんでした：'+e.message)}}render();
</script></body></html>
